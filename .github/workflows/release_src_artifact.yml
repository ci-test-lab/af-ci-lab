name: Release source tarball

on:
  push:
    tags:
      - 'v*'
  # Builds the tarball without publishing it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload_src_tarball:
    name: Upload release source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arrayfire-full-${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: Create the source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "arrayfire-full-$VERSION/.github/scripts/make-source-tarball.sh" "$RUNNER_TEMP/"
          "$RUNNER_TEMP/make-source-tarball.sh" "arrayfire-full-$VERSION" "$VERSION"
      - name: Upload the tarball to the release
        if: github.event_name == 'push' && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" "arrayfire-full-$VERSION.tar.bz2" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep the tarball as an artifact
        if: github.event_name == 'workflow_dispatch' && !env.ACT
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-tarball
          path: arrayfire-full-${{ steps.version.outputs.version }}.tar.bz2
